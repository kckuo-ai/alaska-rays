name: Lidar building heights

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/lidar_heights.py
      - .github/workflows/lidar-heights.yml

permissions:
  contents: write

concurrency:
  group: lidar-heights
  cancel-in-progress: false

jobs:
  heights:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install "laspy[lazrs]==2.7.0" numpy shapely pyproj scipy
      - name: Compute heights from NOAA 2015 Anchorage lidar
        run: |
          set -o pipefail
          mkdir -p lidar
          python scripts/lidar_heights.py 2>&1 | tee lidar/run.log
      - name: Commit results (also on failure, so the log is visible)
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add lidar/
          git commit -m "Lidar building heights from NOAA 2015 Anchorage survey (Actions run ${{ github.run_number }})" || echo "nothing to commit"
          git pull --rebase origin main && git push origin HEAD:main
